<!--
  Shortcode "iframe": embute HTML já pronto (relatórios em R/distill/rmarkdown)
  dentro de uma página do PaperMod sem que o CSS do documento embutido
  quebre o layout do tema.

  Parâmetros: src (obrigatório) = caminho do arquivo em static/, ex: /relatorios/arquivo.html
              title (opcional)  = título usado no atributo title do iframe
-->
<div style="position:relative; width:100%; padding-top:70%; margin: 1.5rem 0;">
  <iframe
    src="{{ .Get "src" }}"
    title="{{ .Get "title" | default "Documento embutido" }}"
    loading="lazy"
    style="position:absolute; top:0; left:0; width:100%; height:100%; border:1px solid var(--border, #ccc); border-radius:8px;"
    allowfullscreen>
  </iframe>
</div>
<p style="text-align:right; font-size:0.85rem; margin-top:-1rem;">
  <a href="{{ .Get "src" }}" target="_blank" rel="noopener">Abrir em tela cheia ↗</a>
</p>
